# 首页「开源 R 包 · 精选」一栏。
#
# 只显示 featured: true 的包，按这里的顺序，最多 4 个（多写的会被忽略）。
# 全部 R 包在 _data/projects.yml 的「R 包」分类里维护；那里的包数多于首页精选数时，
# 标题右侧会自动出现“全部 N 个 R 包 →”，链到项目页的 R 包分类。
# 新写了包：先加进 projects.yml；想上首页再在这里加一条并写 featured: true，
# 首页已满 4 个时，把想替换掉的那个改成 featured: false。
#
# featured: 写 true 才在首页显示
# name:   包名
# logo:   六边形图标，放在 images/packages/ 下，只写文件名；建议 166×192 的 PNG；留空则显示墨绿色占位六边形
# url:    点击图标和包名跳转的地址（一般是文档站）
# desc:   一句话用途，尽量不超过 12 个字，太长会折行
# badge:  图标下方的小标签，如版本号、CRAN
# cran:   写 true 时，标签后面自动显示 CRAN 累计下载量徽章（数字实时更新）

packages:
  - name: "mintyr"
    featured: true
    logo: "mintyr.png"
    url: "https://tony2015116.github.io/mintyr/"
    desc: "分组数据处理与导出"
    badge: "CRAN"
    cran: true
  - name: "tidypptsda"
    featured: true
    logo: "tidypptsda.png"
    url: "https://tony2015116.github.io/tidypptsda/"
    desc: "测定站采食数据清洗与分析"
    badge: "v1.6.5"
  - name: "tidypptsdm"
    featured: true
    logo: "tidypptsdm.png"
    url: "https://tony2015116.github.io/tidypptsdm/"
    desc: "测定站每日监控报告"
    badge: "R · Python · PyPI"
  - name: "pigheatmap"
    featured: true
    logo: "pigheatmap.png"
    url: "https://tony2015116.github.io/pigheatmap/"
    desc: "猪场生产数据性能热图"
    badge: "v0.2.0"
