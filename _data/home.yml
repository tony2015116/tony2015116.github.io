# 首页「开源 R 包 · 精选」一栏。
#
# 只显示 featured: true 的包，按这里的顺序，最多 6 个（多写的会被忽略）。
# 电脑上 4～5 个排一行；6 个排成每行 3 个的两行。手机上始终是一列列表。
# 全部 R 包在 _data/projects.yml 的「R 包」分类里维护；那里的包数多于首页精选数时，
# 标题右侧会自动出现“全部 N 个 R 包 →”，链到项目页的 R 包分类。
# 新写了包：先加进 projects.yml；想上首页再在这里加一条并写 featured: true，
# 首页已满 6 个时，把想替换掉的那个改成 featured: false。
#
# featured: 写 true 才在首页显示
# name:   包名
# logo:   六边形图标，放在 images/packages/ 下，只写文件名；建议 166×192 的 PNG；留空则显示墨绿色占位六边形
# url:    点击图标和包名跳转的地址（一般是文档站）
# desc:   一句话用途，尽量不超过 12 个字，太长会折行
# badge:  图标下方的小标签，如版本号、CRAN
# cran:   写 true 时，标签后自动加上 CRAN 累计下载量，如“CRAN · 下载 6,762”（部署时获取，每天自动更新）

packages:
