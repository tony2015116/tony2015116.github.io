# 项目页（GitHub 项目）
# 先写分类，每个分类下列出项目。分类和项目都按这里的顺序显示，重要的放前面。
#
# category:    分类名称，显示在页面顶部，例如 "R 包"、"分析流程"、"工具"
# key:         分类的英文短名（只用字母、数字、短横线），用于网址，如 /portfolio/#r-packages
# items:       该分类下的项目
#   name:        项目名称
#   repo:        GitHub 仓库，写成 用户名/仓库名（有 url 时可省略）
#   url:         站内页面地址（可选），如 /files/cheatsheets/hiblup.html；填了后项目名链接到这里
#   url_title:   url 链接显示的文字（可选），默认“在线查看”
#   description: 一两句话说明这个项目做什么、解决什么问题
#   language:    主要语言（可选）
#   year:        开始年份或时间段（可选）
#   links:       其他链接（可选），如文档、CRAN、论文
#   citation:    引用信息（可选），显示在项目下方，带“复制”按钮。发布新版本后记得改版本号
#   bibtex:      BibTeX 格式的引用（可选），点“BibTeX”展开。用 | 开头，下面每行缩进写

- category: "R 包"
  key: "r-packages"
  items:
    - name: "mintyr"
      repo: "tony2015116/mintyr"
      description: "基于 data.table 的分组数据处理：批量导入、分组重塑与交叉验证，并为 HIBLUP、DMU、ASReml-R 导出输入文件。"
      language: "R"
      year: "2024 – 至今"
      links:
        - title: "文档"
          url: "https://tony2015116.github.io/mintyr/"
        - title: "CRAN"
          url: "https://CRAN.R-project.org/package=mintyr"
      citation: "Guo M (2026). mintyr: Grouped and Nested Data Pipelines Built on 'data.table'. R package version 0.2.0, https://CRAN.R-project.org/package=mintyr."
      bibtex: |
        @Manual{mintyr,
          title = {mintyr: Grouped and Nested Data Pipelines Built on 'data.table'},
          author = {Meng Guo},
          year = {2026},
          note = {R package version 0.2.0},
          url = {https://CRAN.R-project.org/package=mintyr},
        }
    - name: "tidypptsda"
      repo: "tony2015116/tidypptsda"
      description: "种猪测定站（NEDAP、FIRE）采食数据的清洗与分析，算出日增重、日采食量和料肉比，删掉的每条记录都写明原因。"
      language: "R"
      year: "2025 – 至今"
      links:
        - title: "文档"
          url: "https://tony2015116.github.io/tidypptsda/"
        - title: "进苗规划"
          url: "https://tony2015116.github.io/tidypptsda/planner.html"
      citation: "Guo M (2026). tidypptsda: Process and Analyse Pig Performance Testing Station Data. R package version 1.6.2, https://github.com/tony2015116/tidypptsda."
      bibtex: |
        @Manual{tidypptsda,
          title = {tidypptsda: Process and Analyse Pig Performance Testing Station Data},
          author = {Meng Guo},
          year = {2026},
          note = {R package version 1.6.2},
          url = {https://github.com/tony2015116/tidypptsda},
        }
    - name: "tidypptsdm"
      repo: "tony2015116/tidypptsdm"
      description: "测定站每日监控：汇总最近几天的数据，列出当天警报，生成 HTML 报告和 Excel，可每天定时运行。"
      language: "R"
      year: "2026 – 至今"
      links:
        - title: "文档"
          url: "https://tony2015116.github.io/tidypptsdm/"
        - title: "快速入门"
          url: "https://tony2015116.github.io/tidypptsdm/articles/tidypptsdm-zh.html"
      citation: "Guo M (2026). tidypptsdm: Daily Monitoring of Pig Performance Testing Stations. R package version 1.1.1, https://github.com/tony2015116/tidypptsdm."
      bibtex: |
        @Manual{tidypptsdm,
          title = {tidypptsdm: Daily Monitoring of Pig Performance Testing Stations},
          author = {Meng Guo},
          year = {2026},
          note = {R package version 1.1.1},
          url = {https://github.com/tony2015116/tidypptsdm},
        }
    - name: "pigheatmap"
      repo: "tony2015116/pigheatmap"
      description: "猪场生产数据的性能热图，按胎次 × 月份等维度汇总；样本少的格子自动变淡，一眼看出哪些结果可靠。"
      language: "R"
      year: "2026 – 至今"
      links:
        - title: "文档"
          url: "https://tony2015116.github.io/pigheatmap/"
        - title: "快速上手"
          url: "https://tony2015116.github.io/pigheatmap/articles/pigheatmap.html"
      citation: "Guo M (2026). pigheatmap: Performance Heatmaps for Swine Production Data. R package version 0.2.0, https://github.com/tony2015116/pigheatmap."
      bibtex: |
        @Manual{pigheatmap,
