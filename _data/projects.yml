      description: "R 包 tidypptsdm 的 Python 版本，计算结果与 R 版逐表一致：读取 NEDAP / FIRE 测定站导出文件，生成每日汇总表、警报、中文 HTML 报告和 Excel 工作簿；可在 Python 中调用，也可用命令行 tidypptsdm 运行或设为每天定时任务（Windows 任务计划程序或 crontab）。"
