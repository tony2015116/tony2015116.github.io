<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>思维导图 · 遗传评估与种猪选留（张勤）</title>
<style>
  :root{
    --bg:#f7f6f2; --ink:#22252b; --muted:#6b7078; --line:#c9c6bd; --card:#ffffff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;overflow:hidden}
  header{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:14px;
    padding:0 18px;background:rgba(247,246,242,.92);backdrop-filter:blur(6px);border-bottom:1px solid #e4e1d8;z-index:10}
  header a.back{font-size:13px;font-weight:700;color:#3a6ea5;text-decoration:none;white-space:nowrap}
  header h1{font-size:16px;margin:0;font-weight:600;white-space:nowrap}
  header .src{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tools{margin-left:auto;display:flex;gap:6px}
  .tools button{border:1px solid #d6d2c7;background:#fff;border-radius:6px;padding:6px 10px;font-size:13px;cursor:pointer;color:var(--ink)}
  .tools button:hover{background:#f0ede5}
  #viewport{position:absolute;top:56px;left:0;right:0;bottom:0;cursor:grab}
  #viewport.dragging{cursor:grabbing}
  #stage{position:absolute;left:0;top:0;width:10000px;height:10000px;transform-origin:0 0}
  svg#links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
  .node{position:absolute;width:max-content;max-width:270px;padding:7px 11px;border-radius:8px;background:var(--card);
    border:1px solid #e2dfd6;border-left:4px solid var(--c);font-size:13px;line-height:1.55;
    box-shadow:0 1px 2px rgba(0,0,0,.04);user-select:none;transition:box-shadow .15s}
  .node.has-kids{cursor:pointer}
  .node.has-kids:hover{box-shadow:0 2px 8px rgba(0,0,0,.10)}
  .node .d{display:block;color:var(--muted);font-size:12px;margin-top:2px}
  .node.depth0{background:#22252b;color:#fff;border:none;font-size:17px;font-weight:700;padding:14px 18px;max-width:240px;text-align:center}
  .node.depth0 .d{color:#c9ccd2;font-weight:400}
  .node.depth1{background:var(--c);color:#fff;border:none;font-size:15px;font-weight:600;padding:9px 14px}
  .node.depth1 .d{color:rgba(255,255,255,.85)}
  .node.depth2{font-weight:600}
  .node.has-kids:not(.depth0){padding-right:20px}
  .node.note{background:#fffbea;border-style:dashed;border-left-style:solid}
  .badge{position:absolute;right:-9px;top:50%;transform:translateY(-50%);width:18px;height:18px;border-radius:50%;
    background:#fff;border:1.5px solid var(--c);color:var(--c);font-size:11px;line-height:15px;text-align:center;font-weight:700}
  .formula{font-family:"Cambria Math","Times New Roman",serif;font-style:italic;background:rgba(0,0,0,.05);padding:0 4px;border-radius:3px}
  .depth1 .formula{background:rgba(255,255,255,.2)}
  .hint{position:fixed;left:14px;bottom:12px;font-size:12px;color:var(--muted);background:rgba(255,255,255,.8);padding:5px 9px;border-radius:6px}
  @media print{header,.hint{display:none}#viewport{top:0}}
</style>
</head>
<body>
<header>
  <a class="back" href="/portfolio/#tutorials">← 返回项目</a>
  <h1>遗传评估与种猪选留</h1>
  <span class="src">张勤（中国农业大学）·《北方牧业》2024，第13–14版</span>
  <div class="tools">
    <button id="expandAll">全部展开</button>
    <button id="collapseAll">收起到一级</button>
    <button id="fit">适应窗口</button>
  </div>
</header>
<div id="viewport"><div id="stage"><svg id="links"></svg></div></div>
<div class="hint">点击节点展开/收起 · 拖动画布平移 · 滚轮缩放</div>

<script>
const data = {t:"遗传评估与种猪选留", d:"张勤 · 中国农业大学", c:[
  {t:"一、遗传评估", color:"#3a6ea5", c:[
    {t:"定义", c:[
      {t:"评定个体的种用价值（不是商业价值）"},
      {t:"即：选作种猪后，对后代的遗传贡献有多大"},
      {t:"作用", c:[
        {t:"为选种选配提供科学依据"},
        {t:"检验育种场多年育种工作的效果"}
      ]}
    ]},
    {t:"为什么要做", c:[
      {t:'遗传进展公式', d:'<span class="formula">ΔG = 选择强度 × 选择准确性 × 遗传变异性 / 世代间隔</span>'},
      {t:"育种围绕四个方面", d:"提高选择强度、准确性、遗传变异性；缩短世代间隔"},
      {t:"准确性最关键", d:"选不准，其他做了也没用"},
      {t:"表型 = 遗传 + 环境", d:"表型优秀 ≠ 遗传优秀，可能只是环境更好；只能通过遗传评估判断"}
    ]},
    {t:"基本原则", c:[
      {t:"① 尽可能消除环境影响", c:[
        {t:"环境因素", d:"饲料、营养水平、性别、猪舍环境、管理方式、饲养员、疫病、母猪泌乳和护仔能力"},
        {t:"有已知可控的，也有未知或不可控的", d:"尽量保持一致，减少个体间环境差异"}
      ]},
      {t:"② 尽可能利用各种可利用的信息", d:"主要指亲属；信息越多、亲缘越近，准确性越高", c:[
        {t:"个体本身 = 1"},
        {t:"父母、后代、全同胞 = 1/2"},
        {t:"半同胞、祖代 = 1/4"},
        {t:"曾祖代 = 1/8"}
      ]},
      {t:"③ 采用科学的育种值估计方法", c:[
        {t:"充分合理利用所有信息，有效校正环境影响"},
        {t:"目标：估计值与真实育种值的相关最大"},
        {t:"现用方法：动物模型 BLUP"}
      ]}
    ]},
    {t:"基本内容", c:[
      {t:"育种值估计（EBV）", d:"每个个体、每个性状一个 EBV，衡量单性状遗传优劣"},
      {t:"综合选择指数", d:"根据育种目标，对各目标性状 EBV 加权得到"}
    ]},
    {t:"基本流程", c:[
      {t:"数据准备", c:[
        {t:"能反映个体真实性能"},
        {t:"能反映群体真实水平"},
        {t:"要求：完整、连续、数量足够"}
      ]},
      {t:"数据检查", c:[
        {t:"性状值检查"},
        {t:"记录完整性检查"},
        {t:"系谱检查"}
      ]}
    ]}
  ]},
  {t:"二、育种值估计", color:"#2f8a6b", c:[
    {t:"动物模型 BLUP", c:[
      {t:"目前世界公认最好的育种值估计方法"},
      {t:"各国普遍采用的常规方法，也用于其他畜种"}
    ]},
    {t:"模型的含义", d:"性状表型值与各影响因素之间的线性表达式"},
    {t:"生长性状模型", d:'<span class="formula">日龄 / 背膘厚 = 场-年-季-性别 + 窝效应 + 个体育种值</span>', c:[
      {t:"场-年-季-性别", d:"测定时所在场、年份、季节及性别"},
      {t:"窝效应", d:"同母同胎次仔猪；来自母亲泌乳能力和窝的小环境"},
      {t:"个体育种值", d:"代表遗传影响；其余为环境影响"},
      {t:"同样适用", d:"日增重、饲料利用率、眼肌面积"}
    ]},
    {t:"繁殖性状模型", d:'<span class="formula">产仔数 = 场-年-季 + 持久环境 + 个体育种值</span>', c:[
      {t:"场-年-季", d:"产仔时所在场、年份和季节"},
      {t:"持久环境效应", d:"母猪多胎次重复表现，影响每次产仔的共同环境"},
      {t:"同样适用", d:"产活仔数、出生重均匀度、断奶仔猪数、21日龄窝重、断奶至发情间隔"}
    ]},
    {t:"补充（非原文）：矩阵形式", note:true, d:'<span class="formula">y = Xb + Za + e</span>　b：固定效应（场-年-季-性别）；a：个体育种值；窝/持久环境为额外随机效应'}
  ]},
  {t:"三、选择指数", color:"#b7792b", c:[
    {t:"定义", d:'<span class="formula">I = Σ W<sub>i</sub> · EBV<sub>i</sub></span>　按性状相对重要性加权'},
    {t:"相当于育种目标", c:[
      {t:"目标性状有哪些"},
      {t:"各性状的相对重要性"}
    ]},
    {t:"加权方式：经济重要性", d:"每改进一个单位带来的经济价值（如产仔数+1头 vs 日龄−1天 vs 背膘−1mm）"},
    {t:"全国种猪遗传评估中心的指数", c:[
      {t:"父系指数", d:"目标性状：百公斤日龄、背膘厚（EBV 除以其标准差后按相对权重加权）"},
      {t:"母系指数", d:"日龄 0.3、背膘厚 0.1、总产仔数 0.6"},
      {t:"标准化", d:"群体均值 100，标准差 25；只是转换，便于使用"}
    ]}
  ]},
  {t:"四、种猪选留", color:"#b3473f", c:[
    {t:"两个核心问题", c:[
      {t:"留多少", d:"决定选择强度和世代间隔"},
      {t:"留什么样的猪", d:"决定选择准确性和遗传变异性"}
    ]},
    {t:"选择差与留种率", c:[
      {t:"选择差", d:"留种群平均数 − 测定群平均数，越大越好"},
      {t:"留种率越小 → 选择差越大、选择强度越大", d:"例：留种率 1% 时选择强度约 2.67"},
      {t:"留种率 = 选留后备种猪数 / 测定个体数", d:"分母为测定（参加评估）个体数，分子为后备猪数"},
      {t:"常见错误", c:[
        {t:"分母用当年出生仔猪数"},
        {t:"分子用最终实际种用数", d:"后备猪中被淘汰的那部分指数高低不一定"}
      ]}
    ]},
    {t:"留什么样的猪", c:[
      {t:"① 必须经过性能测定", d:"有个体本身记录才有可靠评估；公猪无产仔记录，繁殖性状靠亲属；生长性能测定公母都必须有"},
      {t:"② 优先根据指数大小", d:"选留指数最高的个体"},
      {t:"③ 参考 EBV", d:"某性状 EBV 特别突出可留，但其他性状应不低于平均水平"},
      {t:"④ 兼顾体型、血统、健康状况"},
      {t:"⑤ 保持一定数量公猪血统，防止近交", d:"必要时淘汰最差血统；血统不足可引种"}
    ]},
    {t:"作者建议标准", c:[
      {t:"留种母猪指数在前 40%"},
      {t:"留种公猪指数至少在前 20%"},
      {t:"期望留种率", d:"公猪 < 5%，母猪约 20%；放宽是为体型、血统、健康留余地"},
      {t:"关键：不管留种率多少，看选择差有多大"}
    ]},
    {t:"反面案例（100kg 日龄）", c:[
      {t:"测定群 170 天，留种群 168 天", d:"选择差不到 2 天"},
      {t:"180、200 天以上的猪也被留下", d:"按前40%，界限应约 160 天"},
      {t:"与随机留种无异 → 不要期望遗传进展"}
    ]}
  ]},
  {t:"五、种猪选配", color:"#6b4fa0", c:[
    {t:"① 根据亲缘系数，避免近交", d:"软件选配功能先看公母猪亲缘系数"},
    {t:"② 根据性能选配", c:[
      {t:"同质选配（主要方式）", d:"好配好、差配差；增大后代变异，更可能出现极端优秀个体；优秀公猪可适当多配"},
      {t:"异质选配", d:"好公猪配差母猪；增加后代一致性；育种核心群很少用"}
    ]},
    {t:"遗传进展分析", c:[
      {t:"遗传进展", d:"各年份出生、参加评估猪只的平均 EBV 或平均指数的变化趋势"},
      {t:"表型进展", d:"各年度出生猪只平均表型值的变化趋势"},
      {t:"有效育种 → 遗传趋势持续稳定地朝一个方向变化", d:"表型可随年份波动；用于检验育种效果"}
    ]}
  ]}
]};

const stage = document.getElementById('stage');
const svg = document.getElementById('links');
const viewport = document.getElementById('viewport');
const HGAP = 46, VGAP = 10;
let all = [];

function build(n, depth, parent, color){
  n.depth = depth; n.parent = parent; n.color = n.color || color || '#22252b';
  n.c = n.c || [];
  n.collapsed = depth >= 2 && n.c.length > 0 ? false : false;
  const el = document.createElement('div');
  el.className = 'node depth' + Math.min(depth,3) + (n.c.length ? ' has-kids' : '') + (n.note ? ' note' : '');
  el.style.setProperty('--c', n.color);
  el.innerHTML = '<span class="t">' + n.t + '</span>' + (n.d ? '<span class="d">' + n.d + '</span>' : '');
  if (n.c.length && depth > 0){
    const b = document.createElement('span'); b.className = 'badge'; el.appendChild(b); n.badge = b;
  }
  if (n.c.length) el.addEventListener('click', e => { if (moved) return; n.collapsed = !n.collapsed; render(); });
  stage.appendChild(el);
  n.el = el; all.push(n);
  n.c.forEach(k => build(k, depth+1, n, depth === 0 ? k.color : n.color));
}
build(data, 0, null);

function visible(n){ let p = n.parent; while(p){ if(p.collapsed) return false; p = p.parent; } return true; }

function measure(){ all.forEach(n => { if (n.el.style.display !== 'none'){ n.w = n.el.offsetWidth; n.h = n.el.offsetHeight; } }); }

function sub(n){ // subtree height
  const kids = n.collapsed ? [] : n.c;
  if (!kids.length) return n.sh = n.h;
  let s = 0; kids.forEach((k,i) => { s += sub(k) + (i ? VGAP : 0); });
  n.kh = s; return n.sh = Math.max(n.h, s);
}
function place(n, x, top){
  n.x = x; n.y = top + n.sh/2 - n.h/2;
  const kids = n.collapsed ? [] : n.c;
  if (!kids.length) return;
  // column x: align children of same parent
  const cx = x + n.w + HGAP;
  let y = top + (n.sh - n.kh)/2;
  kids.forEach(k => { place(k, cx, y); y += k.sh + VGAP; });
}

function render(){
  all.forEach(n => { n.el.style.display = visible(n) ? '' : 'none';
    if (n.badge) n.badge.textContent = n.collapsed ? n.c.length : '−'; });
  measure(); sub(data); place(data, 20, 20);
  let maxX = 0, maxY = 0, paths = '';
  all.forEach(n => {
    if (!visible(n)) return;
    n.el.style.left = n.x + 'px'; n.el.style.top = n.y + 'px';
    maxX = Math.max(maxX, n.x + n.w); maxY = Math.max(maxY, n.y + n.h);
    if (n.parent){
      const p = n.parent, x1 = p.x + p.w, y1 = p.y + p.h/2, x2 = n.x, y2 = n.y + n.h/2, m = (x1 + x2)/2;
      const sw = n.depth === 1 ? 3 : n.depth === 2 ? 2 : 1.4;
      paths += `<path d="M${x1},${y1} C${m},${y1} ${m},${y2} ${x2},${y2}" fill="none" stroke="${n.color}" stroke-opacity="${n.depth===1?.85:.55}" stroke-width="${sw}"/>`;
    }
  });
  svg.setAttribute('width', maxX + 40); svg.setAttribute('height', maxY + 40);
  svg.innerHTML = paths;
  stage.dataset.w = maxX + 40; stage.dataset.h = maxY + 40;
}

// pan & zoom
let scale = 1, tx = 0, ty = 0, dragging = false, moved = false, sx, sy;
function apply(){ stage.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`; }
viewport.addEventListener('mousedown', e => { dragging = true; moved = false; sx = e.clientX - tx; sy = e.clientY - ty; viewport.classList.add('dragging'); });
window.addEventListener('mousemove', e => { if(!dragging) return; const nx = e.clientX - sx, ny = e.clientY - sy;
  if (Math.abs(nx - tx) + Math.abs(ny - ty) > 2) moved = true; tx = nx; ty = ny; apply(); });
window.addEventListener('mouseup', () => { dragging = false; viewport.classList.remove('dragging'); setTimeout(() => moved = false, 0); });
viewport.addEventListener('wheel', e => { e.preventDefault();
  const r = viewport.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  const f = Math.exp(-e.deltaY * 0.0015), ns = Math.min(2.5, Math.max(0.2, scale * f));
  tx = mx - (mx - tx) * ns / scale; ty = my - (my - ty) * ns / scale; scale = ns; apply(); }, {passive:false});
// touch pan
let tstart = null;
viewport.addEventListener('touchstart', e => { if (e.touches.length === 1){ tstart = {x:e.touches[0].clientX - tx, y:e.touches[0].clientY - ty}; } }, {passive:true});
viewport.addEventListener('touchmove', e => { if (tstart && e.touches.length === 1){ tx = e.touches[0].clientX - tstart.x; ty = e.touches[0].clientY - tstart.y; apply(); } }, {passive:true});

function fit(){
  const w = +stage.dataset.w, h = +stage.dataset.h, vw = viewport.clientWidth, vh = viewport.clientHeight;
  scale = Math.min(1.2, Math.max(0.2, Math.min(vw / w, vh / h) * 0.95));
  tx = (vw - w * scale)/2; ty = Math.max(10, (vh - h * scale)/2); apply();
}
document.getElementById('fit').onclick = fit;
document.getElementById('expandAll').onclick = () => { all.forEach(n => n.collapsed = false); render(); fit(); };
document.getElementById('collapseAll').onclick = () => { all.forEach(n => n.collapsed = n.depth >= 1 && n.c.length > 0); render(); fit(); };

// initial: show up to depth 2
all.forEach(n => n.collapsed = n.depth >= 2 && n.c.length > 0);
render(); fit();
window.addEventListener('resize', fit);
</script>
</body>
</html>
